allowBuilds:
  '@parcel/watcher': true
  '@vaadin/vaadin-usage-statistics': true
  better-sqlite3: true
  esbuild: true
  iframe-resizer: true
  msgpackr-extract: true
  unrs-resolver: true
  vue-demi: set this to true or false
minimumReleaseAgeExclude:
  - '@vue/language-core@3.3.6'
  - vite@8.1.2
  - vue-tsc@3.3.6
